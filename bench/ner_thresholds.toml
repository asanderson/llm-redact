# Statistical gates of the NER bench: python -m llm_redact.bench.ner --check
# (docs/ner-bench.md). Not the deterministic gate: `python -m llm_redact.bench
# --check` (recall == 1.0 per rule, exact fp-corpus counts) is separate and
# unchanged.
#
# One table per config name and dataset: [<config name>.<dataset>]. The config
# name is the --config file's stem (or --name); the dataset is its name, plus
# ":SPLIT" when the split is not the default (quote such keys:
# [hf-default."openpii:train"]). A run whose entry is missing FAILS --check:
# record a baseline first.
#
# Keys of an entry (all optional except that the entry must exist):
#   recall = { TYPE = floor, ... }        overlap-typed recall floors per type
#   exact_recall = { TYPE = floor, ... }  exact-match recall floors per type
#   leak_max = 0.15                       character-leak rate ceiling (all gold)
#   type_leak_max = { TYPE = ceiling }    character-leak rate ceilings per type
#   over_redaction_max = 0.01             over-redaction rate ceiling
#   structured_regressions_max = 0        regex-type spans NER may cost (default 0)
#   recorded = "YYYY-MM-DD"               when the baseline was measured
#   note = "..."                          models and revisions it was measured with
#
# Latency (--latency) ceilings are optional: [<config name>.latency] with
#   p50_ms = { "500" = 100.0 }  p95_ms = { ... }  many_small_ms = 30000.0
# A latency run without that table passes, report only.
#
# A floor or type_leak_max on a type the run holds no gold spans of fails: it
# cannot be checked.
# Record a baseline from a measured run minus a tolerance (recall -0.05,
# leak +0.05), with the date and the model revisions.
#
# Example (not a baseline):
#   [hf-default.synthetic]
#   recall = { PERSON = 0.85 }
#   leak_max = 0.15
#   recorded = "2026-10-05"
#   note = "dslim/bert-base-NER at <revision>"

# --- Recorded baselines --------------------------------------------------------
# Measured 2026-10-06 on an x86-64 CPU (4 cores) with torch 2.13.0 (CPU build),
# transformers 5.10.1 and gliner 0.2.28, offline from models pulled at their
# catalog pins; floors = measured - 0.05 rounded down, leak ceilings =
# measured + 0.05 rounded up, over-redaction ceilings = twice the measured
# rate rounded up (near zero, +0.05 would gate nothing). The measured values
# are in each entry's note. The default entities (PERSON) only: ADDRESS,
# DATE_OF_BIRTH, USERNAME and ACCOUNT_NUMBER are not requested, so their
# gold characters count toward the type-agnostic leak rate (about 38% of the
# corpus's gold characters, always leaked): leak_max alone would let PERSON
# leakage grow about fivefold, so type_leak_max gates the requested type.

[hf-default.synthetic]
recall = { PERSON = 0.92 }
exact_recall = { PERSON = 0.90 }
leak_max = 0.45
type_leak_max = { PERSON = 0.09 }
over_redaction_max = 0.01
recorded = "2026-10-06"
note = "dslim/bert-base-NER at d1a3e8f13f8c3566299d95fcfc9a8d2382a9affc; measured PERSON recall 0.974 (exact 0.951), precision 0.913, leak 0.3979 (PERSON 0.0366), over-redaction 0.0031, structured regressions 0"

