name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run so new dependency advisories (the audit job) surface on main
  # without waiting for the next push.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run pytest
      # The concurrency/soak checks are deselected from the default run; run
      # them explicitly so the never-wrong-value-under-load invariants stay live.
      - run: uv run pytest -m soak
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-macos:
    # Both macOS architectures, one Python each: the platform-sensitive
    # surface (kqueue event loop, APFS os.replace, explicit 0600/0700
    # modes, sqlite WAL, SIGHUP) does not vary by Python minor, and macOS
    # runners bill ~10x Linux. macos-15 is Apple silicon (arm64);
    # macos-15-intel is GitHub's x86_64 runner (supported into 2027) —
    # the wheel is pure-Python, so these jobs ARE the x86_64/arm64 macOS
    # support verification.
    name: test (macOS ${{ matrix.arch }}, py3.13)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  test-windows:
    # Phase 26: the supported Windows scope is the Free tier + agent
    # plugins, and this job is its verification — the FULL suite runs, with
    # only narrow, pinned platform gates (POSIX mode assertions become
    # conditional; doctor/service take their win32 branches). PYTHONUTF8
    # keeps the guillemet placeholders printable on a cp1252 console.
    name: test (Windows, py3.13)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  plugins:
    name: agent plugins (install e2e + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # The rendered plugin tree + marketplace must be in sync with
      # plugin_assets.py (also pinned by test, but re-render here so a
      # stale checked-in file fails loudly).
      - run: uv run python scripts/render_plugins.py && git diff --exit-code plugins .claude-plugin
      # Install into a throwaway HOME and prove the command↔CLI contract.
      - run: uv run python scripts/plugin_e2e.py
      # Structural validation of the Claude Code plugin manifest, when the
      # CLI is available (best-effort — never blocks the job if absent).
      - name: claude plugin validate (best-effort)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate --strict plugins/llm-redact || exit 1
          else
            echo "claude CLI not present on the runner; skipping structural validate"
          fi

  helm:
    # The Helm chart (deploy/helm/llm-redact) rendered for real: `helm lint`
    # plus the helm-gated tests in test_deploy_assets.py, which render both
    # value presets (sidecar; standalone+autoscaling) and assert the
    # never-wrong-value guardrail {{ fail }}s a per-pod-vault autoscaled render.
    # helm is installed from the official release with a PINNED version +
    # SHA256 checksum (no marketplace action in the supply chain); the base
    # `test` job already runs the stdlib needle/appVersion tests, which skip
    # the helm-gated ones when helm is absent.
    name: helm chart (lint + render both modes)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.16.3
      HELM_SHA256: f5355c79190951eed23c5432a3b920e071f4c00a64f75e077de0dd4cb7b294ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: install helm (pinned + checksum-verified)
        run: |
          set -euo pipefail
          tarball="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${tarball}" -o "$tarball"
          echo "${HELM_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version
      - name: helm lint
        run: helm lint deploy/helm/llm-redact
      - name: chart tests (renders both presets + guardrail-fires)
        run: uv run pytest tests/test_deploy_assets.py -v
      - name: guardrail fails an autoscaled per-pod-vault render
        run: |
          set -euo pipefail
          if helm template rel deploy/helm/llm-redact \
               --set mode=standalone --set autoscaling.enabled=true \
               --set vault.backend=sqlite >/dev/null 2>err.txt; then
            echo "FAIL: guardrail did not fire for standalone+sqlite+autoscaling"; exit 1
          fi
          grep -q "SHARED vault" err.txt

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Runtime closure only (no dev tools): what a `pip install
      # llm-redact-proxy` user actually gets. Gating on purpose — the
      # closure is tiny (httpx/starlette/uvicorn). If an advisory has no
      # fix released yet, add `--ignore-vuln GHSA-...` with a comment and
      # an issue link, and remove it when the fix ships.
      - run: >
          uv export --frozen --no-dev --no-emit-project --no-hashes
          -o requirements-audit.txt
      - run: uvx pip-audit --strict --no-deps -r requirements-audit.txt

  dependency-review:
    # Blocks a PR that introduces a dependency with a known vulnerability or a
    # disallowed licence, using GitHub's Dependency Graph diff. The graph is
    # available on public repos (and private repos with Advanced Security), so
    # the job self-skips while this repo is private — it arms on go-public,
    # the same switch as PyPI publishing and build attestations. pip-audit
    # (the `audit` job) covers the runtime closure meanwhile.
    name: dependency review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The core is AGPL-3.0-only and is also licensed on other terms (the
          # dual-license model docs/CLA.md describes); a GPL or AGPL
          # dependency would constrain those terms. Flag them for a human
          # decision rather than silently pulling them in.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  ner:
    name: ner extras (spaCy model + presidio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra ner --extra presidio
      # Direct wheel URL: `spacy download` shells out to pip, which does not
      # exist in uv-managed venvs. One model serves both backends (the
      # presidio detector pins en_core_web_sm too).
      - run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      # test_presidio.py includes the real-AnalyzerEngine smoke test, which
      # only runs when the extra and the model are both present — i.e. here.
      - run: uv run pytest tests/test_ner.py tests/test_presidio.py -v

  airgap:
    # AD11: an air-gapped enclave starts the proxy with NER and no network.
    # The connected side pulls the models (the one step with network), then
    # tests/airgap/run_offline.sh runs inside a network namespace with NO
    # route, the pulled folders mounted read-only at /models and an empty
    # Hugging Face cache: `models verify --dir`, `serve --check` for the
    # default hf + GLiNER models (base model included) and Knowledgator's
    # gliner-pii-edge, a Presidio email check (tldextract's suffix list), and
    # an empty folder refused with the `models pull` hint. Every command runs
    # under tests/airgap/no_network.py, which fails on any attempt made
    # through Python's socket module to resolve a host or connect an IP
    # socket, so a Python library that falls back quietly after a failed
    # connection still fails the job (native code connecting by itself is
    # stopped by the namespace with no route, not seen by the wrapper). docs/air-gapped.md
    # walks an operator through the same steps.
    name: air-gapped start (NER models, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: airgap
      # The locked hf, gliner and presidio extras with a CPU-only torch
      # (scripts/cpu_torch.py: torch at its locked version from the PyTorch
      # CPU index, checked against the CPU wheels' recorded SHA-256,
      # everything else hash-checked as uv.lock pins it).
      - name: install the NER extras (CPU torch)
        run: |
          set -euo pipefail
          uv venv
          uv export --frozen --no-dev --no-emit-project --extra hf --extra gliner --extra presidio \
            | python3 scripts/cpu_torch.py requirements "$RUNNER_TEMP/requirements.txt" >"$RUNNER_TEMP/torch.txt"
          uv pip install --no-deps --require-hashes --index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/torch.txt"
          uv pip install --no-deps --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --no-deps -e .
          uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          .venv/bin/python scripts/cpu_torch.py check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: airgap-hub-${{ hashFiles('src/llm_redact/detection/model_catalog.py', 'tests/airgap/pull*.toml') }}
          restore-keys: airgap-hub-
      - name: pull the models (connected side; prints the config lines)
        run: |
          set -euo pipefail
          .venv/bin/llm-redact models pull --to "$RUNNER_TEMP/models" --as /models \
            --config tests/airgap/pull.toml | tee "$RUNNER_TEMP/pull.txt"
          .venv/bin/llm-redact models pull --to "$RUNNER_TEMP/models-edge" --as /models \
            --config tests/airgap/pull-edge.toml | tee "$RUNNER_TEMP/pull-edge.txt"
          # The air-gapped configs load exactly the lines pull printed.
          for pair in pull.txt:config.toml pull-edge.txt:edge.toml; do
            printed="$RUNNER_TEMP/${pair%%:*}"
            config="tests/airgap/${pair#*:}"
            grep -E '^(hf|gliner) = ' "$config" | while IFS= read -r line; do
              grep -qxF "$line" "$printed" || { echo "::error::$config: '$line' is not what models pull printed"; exit 1; }
            done
          done
      - name: verify, serve --check and preview inside a network namespace with no route
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty" "$RUNNER_TEMP/empty-hf" "$RUNNER_TEMP/home"
          sudo unshare --net --mount -- env -i PATH=/usr/bin:/bin \
            HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/data" \
            HF_HOME="$RUNNER_TEMP/empty-hf" \
            tests/airgap/run_offline.sh "$PWD/.venv/bin/python" \
            "$RUNNER_TEMP/models" "$RUNNER_TEMP/models-edge" "$RUNNER_TEMP/empty"
      # The offline wheelhouse recipe (docs/deployment.md, "Offline installs"):
      # downloaded here, installed by pip with --no-index inside a namespace
      # with no route.
      - name: build the offline wheelhouse (connected side)
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/wheelhouse"
          mkdir -p "$wheelhouse"
          python="$(uv python find 3.13)"
          uv export --frozen --no-dev --no-emit-project --extra hf --extra gliner \
            | python3 scripts/cpu_torch.py requirements "$wheelhouse/requirements.txt" >"$wheelhouse/torch.txt"
          "$python" -m venv "$RUNNER_TEMP/pip-download"
          pip="$RUNNER_TEMP/pip-download/bin/pip"
          "$pip" download --require-hashes --no-deps --only-binary=:all: \
            -r "$wheelhouse/requirements.txt" -d "$wheelhouse"
          "$pip" download --require-hashes --no-deps --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu -r "$wheelhouse/torch.txt" -d "$wheelhouse"
          uv build --wheel --out-dir "$wheelhouse"
          du -sh "$wheelhouse"
          echo "PYTHON_FOR_WHEELHOUSE=$python" >>"$GITHUB_ENV"
      - name: install the wheelhouse inside a network namespace with no route
        run: |
          sudo unshare --net -- env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/home" \
            tests/airgap/install_wheelhouse.sh "$PYTHON_FOR_WHEELHOUSE" \
            "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP/wheelhouse-venv"

  ner-models:
    # Real NER models (docs/ner-bench.md, "CI"): the real_model tests, then
    # the NER bench's statistical gates for every bench/configs/*.toml —
    # synthetic-corpus recall floors and leak/over-redaction ceilings
    # (bench/ner_thresholds.toml), false-positive ceilings on the negatives
    # corpus (bench/ner_ceilings.toml) and the latency report. The models are
    # pulled at their catalog pins (`llm-redact models pull`) into the Hugging
    # Face cache, which is cached keyed on the catalog and the configs; the
    # tests and the bench then load them offline, exactly as a proxy with
    # downloads off does. LLM_REDACT_TEST_REAL_MODELS_REQUIRED turns a
    # real_model test that skips (a model not pulled, an extra missing) into
    # a failure instead of a green run that tested nothing.
    name: ner models (real-model tests + NER bench gates)
    runs-on: ubuntu-latest
    # Each bench configuration costs about 3 to 10 minutes (synthetic
    # corpus, negatives corpus, latency) on a 4-core runner; the gliner2
    # PII model about 30 (its 1,000-string latency body alone 10).
    timeout-minutes: 180
    env:
      LLM_REDACT_TEST_REAL_MODELS_REQUIRED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ner-models
      # The locked environment of the four extras with CPU-only torch: the
      # locked PyPI torch wheel brings the CUDA libraries (several GB) no CI
      # runner uses. Everything else is installed exactly as uv.lock pins
      # it, every wheel checked against the lock's sha256, and torch is the
      # PyTorch CPU wheel of the locked version checked against the SHA-256
      # scripts/cpu_torch.py records (the same recipe as the airgap job and
      # the -ner image; docs/dependencies.md).
      - name: install the hf, gliner, gliner2 and bench-data extras (CPU torch)
        run: scripts/ner_ci_env.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: ner-models-hub-${{ hashFiles('src/llm_redact/detection/model_catalog.py', 'bench/configs/*.toml', 'tests/real_model_configs/*.toml') }}
          restore-keys: ner-models-hub-
      # Every model the bench configs and the real_model tests load, at its
      # catalog pin (GLiNER base models included).
      - name: pull the models
        run: |
          for config in bench/configs/*.toml tests/real_model_configs/*.toml; do
            uv run --no-sync llm-redact models pull --config "$config"
          done
      - run: uv run --no-sync pytest -m real_model -v
      # Every config through all three runs, so one crossed gate does not
      # hide another's report; the step fails if any --check failed.
      - name: NER bench gates
        run: |
          status=0
          for config in bench/configs/*.toml; do
            name=$(basename "$config" .toml)
            uv run --no-sync python -m llm_redact.bench.ner --config "$config" --check --out "ner-report/$name-synthetic" || status=1
            uv run --no-sync python -m llm_redact.bench.ner --config "$config" --fp-corpus bench/fp_corpus --check --out "ner-report/$name-fp" || status=1
            uv run --no-sync python -m llm_redact.bench.ner --config "$config" --latency --many-small-strings 1000 --check --out "ner-report/$name-latency" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ner-report
          path: ner-report/
          if-no-files-found: ignore

  rdbms:
    # The RDBMS vault's SQL on REAL engines. The `test` job proves the
    # portable dialect over stdlib sqlite3-as-dbapi and fake drivers; this
    # job runs the env-gated real-server tests (the store battery, the Live
    # resumption handle map and the background map writer's own connection)
    # against PostgreSQL 16 and MySQL 8.4.
    # LLM_REDACT_TEST_REAL_DB_REQUIRED makes a missing DSN a failure, never
    # a skip into a green run. Throwaway service-container credentials only
    # (no secrets); the DSNs are never echoed. Oracle stays the opt-in
    # scripts/oracle_smoke.sh.
    name: rdbms vault (real PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: llmredact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U vault -d llmredact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway-root
          MYSQL_DATABASE: llmredact
          MYSQL_USER: vault
          MYSQL_PASSWORD: ci-throwaway
        ports:
          - 3306:3306
        # TCP, not the socket: the image's init server listens on the socket
        # only, so a socket ping would report healthy too early.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u vault -pci-throwaway --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      LLM_REDACT_TEST_PG_DSN: postgresql://vault:ci-throwaway@127.0.0.1:5432/llmredact
      LLM_REDACT_TEST_MYSQL_DSN: mysql://vault:ci-throwaway@127.0.0.1:3306/llmredact
      LLM_REDACT_TEST_REAL_DB_REQUIRED: postgresql,mysql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra vault-postgres --extra vault-mysql
      - run: >-
          uv run pytest -v --tb=short
          "tests/test_vault_rdbms.py::test_battery_real_server[postgresql]"
          "tests/test_vault_rdbms.py::test_battery_real_server[mysql]"
          "tests/test_vault_handles.py::test_the_handle_map_on_a_real_server[postgresql]"
          "tests/test_vault_handles.py::test_the_handle_map_on_a_real_server[mysql]"
          "tests/test_vault_writer.py::test_background_writes_on_a_real_server[postgresql]"
          "tests/test_vault_writer.py::test_background_writes_on_a_real_server[mysql]"

  bench:
    name: detection bench (report artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python -m llm_redact.bench --latency --out bench-report --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-report
          path: bench-report/

  complexity:
    # Every function with cyclomatic complexity > 1 must be EXECUTED by the
    # suite (scripts/complexity_gate.py). Report-only through 3.1.1; gated
    # here from 3.1.2 — an uncovered branching function fails unless recorded
    # in scripts/complexity_allowlist.py with a justification, and a stale
    # allowlist entry fails too (same discipline as the mutation gate).
    name: complexity coverage (assurance gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: run the suite under coverage
        run: uv run coverage run -m pytest -q
      - name: gate on CC>1 execution (Free core)
        run: uv run python scripts/complexity_gate.py --check
      # The paid package's own complexity gate runs in the llm-redact-pro repo's
      # CI (R4 physical split) — it is no longer in this tree.

  # NOTE (R4 open-core split): the `free-alone` job (which hid the co-located
  # src/llm_redact_pro to simulate a Free-only install) and the `enforcement-ext`
  # job (which compiled the pro Cython enforcement core) both moved to the
  # llm-redact-pro repo. This repo IS the Free-only install now — test_free_alone.py
  # runs in the normal `test` job (the pro package is genuinely absent), and the
  # keyless-boot / paid-config-fails-closed assertions ride there.

  mutation:
    # Assurance: mutation testing proves the suites KILL a weakened guard or a
    # broken checksum, not just that they pass. Scoped to the load-bearing
    # correctness core ([tool.mutmut] in pyproject). GATING via
    # scripts/mutation_gate.py: a surviving mutant fails unless recorded in
    # scripts/mutation_equivalents.py with a reviewed justification, and a
    # stale allow-list entry fails too — nothing survives silently in either
    # direction (see docs/assurance.md). Baseline: 968/1100 killed, 130
    # reviewed equivalents.
    name: mutation testing (assurance gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # mutmut exits non-zero when ANY mutant survives — including the 130
      # reviewed equivalents — so the run itself must not gate; the gate
      # script right after it is the pass/fail arbiter.
      - name: run mutation testing
        run: uv run mutmut run || true
      - name: gate against the equivalents allow-list
        run: uv run python scripts/mutation_gate.py
      - name: summarize survivors
        if: always()
        run: uv run mutmut results | tee mutmut-results.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-results
          path: mutmut-results.txt

  history-hygiene:
    # Non-gating: runs the production detectors over ALL git history and
    # uploads the HISTORY-ONLY report. This is the go-public review signal —
    # flipping the repo public exposes every past commit at once, so the
    # report must be reviewed clean before that (see docs/history-hygiene.md).
    # Not a hard gate: 17 phases carry many benign secret-SHAPED test fixtures.
    name: history hygiene (report artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the sweep
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run python scripts/history_sweep.py | tee history-sweep.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: history-sweep
          path: history-sweep.txt

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check dist/*
      # twine cannot catch missing package data; assert the user guide and
      # the license text ship in both distributions — and that the browser
      # dashboard (an llm-redact-pro surface) does not.
      - name: check package data
        run: |
          ! python -m zipfile -l dist/*.whl | grep 'dashboard.html'
          ! tar -tzf dist/*.tar.gz | grep 'dashboard.html'
          python -m zipfile -l dist/*.whl | grep 'llm_redact/user_guide.md'
          python -m zipfile -l dist/*.whl | grep 'llm_redact/user_guide.html'
          tar -tzf dist/*.tar.gz | grep 'src/llm_redact/user_guide.md'
          tar -tzf dist/*.tar.gz | grep 'src/llm_redact/user_guide.html'
          python -m zipfile -l dist/*.whl | grep 'licenses/LICENSE'
          tar -tzf dist/*.tar.gz | grep -x '[^/]*/LICENSE'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  reproducible-build:
    # Supply-chain assurance: two builds from the same tree with a pinned
    # SOURCE_DATE_EPOCH must be byte-identical — a divergence means embedded
    # timestamps/ordering crept in and the provenance story weakens. Out-dirs
    # live OUTSIDE the workspace: the sdist packs the working tree, so a
    # first build left inside it would poison the second (found the hard way).
    name: reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: build twice with a pinned epoch and compare byte-for-byte
        run: |
          export SOURCE_DATE_EPOCH=1704067200
          uv build --out-dir "$RUNNER_TEMP/build-a"
          uv build --out-dir "$RUNNER_TEMP/build-b"
          status=0
          for f in "$RUNNER_TEMP"/build-a/*; do
            name="$(basename "$f")"
            if cmp -s "$f" "$RUNNER_TEMP/build-b/$name"; then
              echo "IDENTICAL: $name"
            else
              echo "DIFFERS: $name"
              status=1
            fi
          done
          exit "$status"

  container-docker:
    name: container (docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target runtime -t llm-redact:ci .
      - run: docker build --target fake-upstream -t llm-redact-fake:ci .
      - run: ./scripts/container_smoke.sh docker llm-redact:ci llm-redact-fake:ci

  container-ner:
    # The -ner image (stock image + the hf and gliner extras on a CPU-only
    # torch) as release.yml builds it, linux/amd64 only here: the closure is
    # CPU-only, doctor sees both NER backends, and — with no network, a
    # read-only root filesystem and models the image itself pulled with
    # `models pull --to`, mounted read-only at /models — `serve --check`
    # loads them under tests/airgap/no_network.py. NER_EXTRAS must equal
    # release.yml's (tests/test_deploy_assets.py).
    name: container (-ner image, no network)
    runs-on: ubuntu-latest
    needs: test
    env:
      NER_EXTRAS: --extra hf --extra gliner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the -ner image
        run: |
          docker build --target runtime --build-arg "NER_EXTRAS=$NER_EXTRAS" -t llm-redact:ner-ci .
          docker image ls llm-redact:ner-ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: the closure is CPU-only (inside the image, no network)
        run: |
          docker run --rm --network none --entrypoint python \
            -v "$PWD/scripts/cpu_torch.py:/smoke/cpu_torch.py:ro" \
            llm-redact:ner-ci /smoke/cpu_torch.py check
      - name: doctor sees the hf and gliner backends (inside the image, no network)
        run: |
          set -euo pipefail
          # doctor exits non-zero on its FAIL rows (no models are mounted
          # yet); the NER rows are what this step is about.
          docker run --rm --network none -v "$PWD/tests/airgap:/cfg:ro" llm-redact:ner-ci \
            doctor --config /cfg/config.toml >doctor.txt 2>&1 || true
          grep -E '^(PASS|WARN|FAIL) +ner:' doctor.txt
          grep -q '^PASS  ner: hf backend importable' doctor.txt
          grep -q '^PASS  ner: gliner backend importable' doctor.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hf
          key: container-ner-hub-${{ hashFiles('src/llm_redact/detection/model_catalog.py', 'tests/airgap/pull.toml') }}
          restore-keys: container-ner-hub-
      - name: pull the models with the image (connected side)
        run: |
          mkdir -p "$RUNNER_TEMP/hf" "$RUNNER_TEMP/models"
          chmod 0777 "$RUNNER_TEMP/hf" "$RUNNER_TEMP/models"
          docker run --rm -e HF_HOME=/hf -v "$RUNNER_TEMP/hf:/hf" -v "$RUNNER_TEMP/models:/out" \
            -v "$PWD/tests/airgap:/cfg:ro" llm-redact:ner-ci \
            models pull --to /out --as /models --config /cfg/pull.toml
      - name: verify and serve --check with no network and a read-only root
        run: |
          set -euo pipefail
          run() {
            docker run --rm --network none --read-only --tmpfs /tmp \
              --mount type=volume,dst=/data -v "$RUNNER_TEMP/models:/models:ro" \
              -v "$PWD/tests/airgap:/cfg:ro" --entrypoint python llm-redact:ner-ci \
              /cfg/no_network.py "$@"
          }
          run models verify --dir /models
          run serve --check --config /cfg/config.toml

  container-podman:
    name: container (podman, rootless)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: podman build --target runtime -t llm-redact:ci .
      - run: podman build --target fake-upstream -t llm-redact-fake:ci .
      - run: ./scripts/container_smoke.sh podman llm-redact:ci llm-redact-fake:ci
