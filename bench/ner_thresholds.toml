# hf backend started loading in float32 and decoding a BIO tagger without
# word-piece marks word by word, and again after the decoder's review fixes
# (spans grow over the characters the model tags with them; unspaced scripts
# read by character; long words read in parts): the same numbers but one
# more OpenMed USERNAME detection. Floors and ceilings follow the rule above;
# four sit below the token-level decoder's baselines. OpenMed USERNAME recall
# 0.87 to 0.84 and its leak ceiling 0.12 to 0.13: five usernames whose first
