lineage = "synthetic; generated by language models the card does not name"
training = "allowed"
train_split = "train"

[sources.agent-corpus]
local = true
license = "private (not distributed)"
attribution = "llm-redact maintainers"
lineage = "generated by an allowlisted Apache-2.0 teacher (scripts/pii_corpus/teacher.py) and verified by hand"
training = "allowed"
note = "a verified TRAINING share only (review.py output), disjoint from the frozen agent-eval set (--agent-eval): no id, text or generator run in common"

[sources.openpii]
hub_id = "ai4privacy/pii-masking-openpii-1.5m"
revision = "a785eb528e28be2693c3718a27e066970de5dadb"
license = "CC-BY-4.0 (card text); card metadata: license other"
attribution = "OpenPII 1.5M by Ai4Privacy / Ai Suisse SA"
card = "https://huggingface.co/datasets/ai4privacy/pii-masking-openpii-1.5m"
lineage = "synthetic; the card does not say how it was generated; its predecessor releases were generated with Llama models"
training = "needs-confirmation"
gate = "AI4Privacy's written confirmation that OpenPII 1.5M may train a redistributed model"
# Not recorded: openpii stays refused. Only a maintainer commit, once the
# confirmation is in hand, adds the line below (REF = its date and archive
# location); train_student.py plan then needs --openpii-confirmation REF.
# confirmation = "REF"
train_split = "train"
note = "the NER bench scores its validation split; never train on validation"

