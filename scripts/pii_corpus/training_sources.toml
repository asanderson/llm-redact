card = "https://huggingface.co/datasets/beki/privy"
lineage = "synthetic; protocol traces generated from OpenAPI specifications by the Privy tool with data providers, no language model"
training = "allowed"
train_split = "train"
note = "the NER bench scores its test split; never train on test"

[sources.kiji]
hub_id = "DataikuNLP/kiji-pii-training-data"
revision = "0275550f0b1f1b8f2dc9356fd31ac1c788b8228b"
