# NER bench configuration "hf-default" (docs/ner-bench.md): the hf backend
# with its default model (dslim/bert-base-NER at its catalog pin) and the
# default entities (PERSON). Scored in CI by the ner-models job against
# bench/ner_thresholds.toml [hf-default.*] and bench/ner_ceilings.toml
# [hf-default]. Downloads stay off (the default): the CI job and a local run
# fetch the model first with `llm-redact models pull --config` on this file.
[detection.ner]
enabled = true
backend = "hf"
