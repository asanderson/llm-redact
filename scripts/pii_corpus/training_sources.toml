# Data manifest of the student-model recipe (TRAINING.md).
#
# Every dataset the recipe may name, with its license, attribution, pinned
# revision and lineage as read on its card (checked 2026-10-05), and
# whether it may be TRAINED on:
#   training = "allowed"             license-clean; the recipe may use it
#   training = "needs-confirmation"  refused until an OWNER COMMIT records
#                                    the written confirmation its gate names
#                                    as confirmation = "REF" in its table;
#                                    the run's flag must then repeat REF
#   training = "refused"             evaluation only (real data, or a license
#                                    that keeps it out of a shipped model)
# train_student.py refuses every source not listed here. Lineage lines are
# neutral facts, not legal conclusions.

checked = "2026-10-05"

[sources.nemotron]
hub_id = "nvidia/Nemotron-PII"
revision = "b70ffaf5ff39e079776134c5bf4381f00a9fd1ed"
license = "CC-BY-4.0"
attribution = "Nemotron-PII by NVIDIA Corporation (CC BY 4.0)"
card = "https://huggingface.co/datasets/nvidia/Nemotron-PII"
lineage = "synthetic; generated with NVIDIA NeMo Data Designer; the card does not name the generator models"
training = "allowed"
train_split = "train"
note = "the NER bench scores its test split; never train on test"

